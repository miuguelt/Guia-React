version: "3.8"

services:
  web:
    build:
      context: ../codigo-ejemplo
      dockerfile: ../docker/Dockerfile
    container_name: guia-react
    ports:
      - "8030:8030"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8030')"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "coolify.managed=true"
      - "coolify.name=guia-react"
      - "coolify.description=Guia React SENA ADSO"
